<div class="roller" aria-hidden="true"></div>

    <label class="field"><span class="kicker">Title</span><input id="ntitle" name="ntitle" maxlength="120" required></label>

    <label class="field"><span class="kicker">First post</span><textarea id="nbody" name="nbody" rows="4" maxlength="2000" required></textarea></label>

  </form>
