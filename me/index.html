<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vije.sh · VKG-04 Datasheet · 18.1</title>
<meta name="description" content="vije.sh as the datasheet for a personal systems processor. Sub-variation 18.1: shadows and more motion.">
<script>try{if(localStorage.getItem('v181-theme')==='"dark"')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4eee3;--ink:#111214;--mute:#5a5a5e;--line:#ddd5c7;--line2:#b5ad9f;--faint:#ece5d8;--red:#e30613;--red-t:#c4050f;--pin:#a9acb2;--chip:#141518;--chip-t:#f4f4f2;--card:#f8f3ea;color-scheme:light;
  --sc:60 40 20;--sh1:0 1px 2px rgb(var(--sc)/.08),0 2px 6px rgb(var(--sc)/.06);--sh2:0 2px 4px rgb(var(--sc)/.07),0 10px 24px -6px rgb(var(--sc)/.18);--sh3:0 4px 8px rgb(var(--sc)/.08),0 22px 48px -12px rgb(var(--sc)/.3);--shr:0 8px 22px -8px rgb(227 6 19/.55)}
[data-theme=dark]{--bg:#0c0d0f;--ink:#efefec;--mute:#a0a3aa;--line:#25272c;--line2:#3b3e45;--faint:#141518;--red-t:#ff4b55;--pin:#6b6e75;--chip:#1d1f24;--card:#121316;color-scheme:dark;
  --sc:0 0 0;--sh1:0 1px 2px rgb(0 0 0/.5),0 2px 6px rgb(0 0 0/.35);--sh2:0 2px 4px rgb(0 0 0/.45),0 12px 26px -6px rgb(0 0 0/.7);--sh3:0 4px 8px rgb(0 0 0/.5),0 24px 50px -12px rgb(0 0 0/.85);--shr:0 8px 26px -6px rgb(255 40 50/.45)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Space Grotesk",system-ui,sans-serif;transition:background-color .3s,color .3s}
a{color:inherit}
.mono,.btn,pre,kbd{font-family:"JetBrains Mono",ui-monospace,monospace}
.wrap{max-width:112rem;margin:0 auto;padding:0 clamp(1.5rem,4vw,5rem)}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.skip{position:absolute;left:-999px;top:1rem;z-index:60;background:var(--bg);padding:.5rem 1rem;border:1px solid var(--ink)}
.skip:focus{left:1rem}
kbd{font-size:.8em;border:1px solid var(--line2);padding:0 .3rem}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);transition:box-shadow .3s}
.top.scrolled{box-shadow:var(--sh2)}
.top .wrap{display:flex;align-items:center;gap:1.25rem;min-height:3.5rem}
.top nav{min-width:0;flex:1}
.brand{display:flex;align-items:center;gap:.55rem;text-decoration:none;font-weight:700;font-size:1.15rem;letter-spacing:-.02em;white-space:nowrap}
.brand .led{width:.55rem;height:.55rem;background:var(--red);border-radius:50%;box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 20%,transparent);animation:hb 1.8s infinite}
.brand small{font:500 .66rem "JetBrains Mono",monospace;color:var(--mute);border:1px solid var(--line2);padding:.05rem .35rem;letter-spacing:.04em}
.nav{display:flex;gap:.15rem;list-style:none;margin:0;padding:0;overflow-x:auto;scrollbar-width:none}
.nav a{display:flex;gap:.4rem;align-items:baseline;padding:1.05rem .65rem 1rem;text-decoration:none;font:500 .8rem "JetBrains Mono",monospace;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.nav a i{font-style:normal;font-size:.62rem}
.nav a{position:relative}
.nav a::after{content:"";position:absolute;left:.65rem;right:.65rem;bottom:-2px;height:2px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .25s}
.nav a:hover::after{transform:scaleX(1)}
.nav a[aria-current=page]::after{display:none}
.nav a:hover{color:var(--ink)}
.nav a[aria-current=page]{color:var(--ink);border-bottom-color:var(--red)}
.nav a[aria-current=page] i{color:var(--red-t)}
.sw{display:flex;align-items:center;gap:.5rem;background:none;border:0;color:var(--ink);font:500 .75rem "JetBrains Mono",monospace;cursor:pointer;padding:.5rem 0;white-space:nowrap}
.sw .track{width:2.2rem;height:1.2rem;border:1px solid var(--ink);border-radius:1rem;position:relative}
.sw .knob{position:absolute;top:2px;left:2px;width:.85rem;height:.85rem;border-radius:50%;background:var(--ink);transition:transform .2s,background-color .2s}
.sw[aria-pressed=true] .knob{transform:translateX(1rem);background:var(--red)}

/* running header and footer */
.runhead,.runfoot{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font:400 .68rem "JetBrains Mono",monospace;color:var(--mute);text-transform:uppercase;letter-spacing:.07em}
.runhead{padding:1rem 0 .6rem;border-bottom:2px solid var(--ink)}
.runfoot{padding:1rem 0 2rem}

/* hero */
.hero{padding:3rem 0}
@media (min-width:48rem){.hero{min-height:calc(100svh - 9.5rem);display:flex;align-items:center;padding:2rem 0}.hero-g{width:100%}}
.hero-g{display:grid;grid-template-columns:1.1fr .9fr;gap:3rem;align-items:center}
.hero-l .wm-rule{margin-bottom:1.25rem}
.pn{font:500 .72rem "JetBrains Mono",monospace;color:var(--red-t);letter-spacing:.08em;margin:0;text-transform:uppercase}
.wm{font-size:clamp(5rem,23vw,19rem);line-height:.86;letter-spacing:-.065em;margin:.5rem 0 0;padding:0 .04em .17em 0;font-weight:700;white-space:nowrap;overflow:hidden}
.wmi{display:inline-block}
.wm .ch{display:inline-block}
.wm .dot{color:var(--red)}
.wm-rule{height:2px;background:var(--ink);position:relative}
.wm-rule::after{content:"";position:absolute;right:-1px;top:-4px;width:10px;height:10px;background:var(--red)}
.wm:focus,.ph:focus,.post h1:focus{outline:none}
.wm.reflash{animation:rf .5s steps(1)}
.sub{font-size:1.35rem;font-weight:500;margin:0;letter-spacing:-.01em}
.tag{font:500 .88rem "JetBrains Mono",monospace;margin:.35rem 0 1.2rem;color:var(--mute)}
.tag::before{content:"> ";color:var(--red-t)}
.bio{max-width:34rem;margin:0}
.ctas{display:flex;gap:.75rem;flex-wrap:wrap;margin:1.75rem 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem 1.3rem;border:1px solid var(--ink);background:var(--bg);color:var(--ink);font-size:.8rem;font-weight:500;text-decoration:none;cursor:pointer;transition:background-color .15s,color .15s,border-color .15s,transform .15s,box-shadow .15s;min-height:2.75rem;box-shadow:3px 3px 0 var(--line2)}
.btn:hover{background:var(--ink);color:var(--bg);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line2)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line2)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%);box-shadow:none;filter:drop-shadow(0 6px 10px rgb(227 6 19/.35))}
.btn.red:hover{background:var(--ink);border-color:var(--ink);color:var(--bg);box-shadow:none;filter:drop-shadow(0 10px 14px rgb(var(--sc)/.3))}
.btn.red:active{box-shadow:none;filter:none}
.btn.sm{padding:.45rem .9rem;font-size:.74rem;min-height:2.4rem}
.btn:disabled{opacity:.5;cursor:default}
.fw{display:flex;align-items:center;gap:.8rem;font:400 .72rem "JetBrains Mono",monospace;border:1px solid var(--line);padding:.55rem .55rem .55rem .8rem;max-width:34rem;flex-wrap:wrap;background:var(--card);box-shadow:var(--sh1)}
.fw b{font-weight:700}
.fwbar{flex:1;min-width:5rem;height:6px;background:var(--faint);border:1px solid var(--line)}
.fwbar i{display:block;height:100%;width:0;background:var(--red)}
.hero-r{background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:16px 16px;padding:.5rem;perspective:900px}
.chip{width:100%;max-width:min(clamp(400px,30vw,600px),calc(100svh - 26rem));min-width:300px;display:block;margin:0 auto;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.chip .body{filter:drop-shadow(var(--sx,0px) var(--sy,6px) 8px rgb(var(--sc)/.45)) drop-shadow(calc(var(--sx,0px) * 2) calc(var(--sy,6px) * 2.4) 18px rgb(var(--sc)/.25))}
.chip .pad,.chip .via{filter:drop-shadow(0 1px 1px rgb(var(--sc)/.3))}
.chip .stub{fill:var(--pin)}
.chip .body{fill:var(--chip);stroke:var(--line2)}
.chip .ct{fill:var(--chip-t);font-family:"JetBrains Mono",monospace;text-anchor:middle}
.chip .tr,.chip .trd{fill:none;stroke:var(--line2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip .via,.chip .pad{fill:var(--bg);stroke:var(--line2);stroke-width:2}
.chip .net{font:400 8px "JetBrains Mono",monospace;fill:var(--mute)}
.chip .pin text.l{font:500 11px "JetBrains Mono",monospace;fill:var(--ink);letter-spacing:.04em}
.chip .pin .pnum{font:500 8px "JetBrains Mono",monospace;fill:var(--chip-t);opacity:.7}
.chip .pin .hit{fill:transparent}
.chip .pin:hover .tr,.chip .pin:focus-visible .tr,.chip .pin.on .tr{stroke:var(--red)}
.chip .pin:hover .pad,.chip .pin:focus-visible .pad,.chip .pin.on .pad{stroke:var(--red);fill:var(--red)}
.chip .pin:hover text.l,.chip .pin.on text.l{fill:var(--red-t)}
.chip .pin:hover .tr,.chip .pin:focus-visible .tr{stroke-dasharray:.06 .04;animation:flow .6s linear infinite}
.chip .pkt{fill:var(--red);pointer-events:none}
.chip .pin:focus{outline:none}
.chip .pin:focus-visible .hit{stroke:var(--red);stroke-width:1.5;stroke-dasharray:3 3}
.chip .led{fill:var(--red);animation:hb 1.8s infinite}
.chip .p1{fill:var(--red)}
.uart{border:1px solid var(--line);background:var(--faint);box-shadow:var(--sh2);margin:.75rem auto 0;max-width:max(300px,min(clamp(400px,30vw,600px),calc(100svh - 26rem)))}
.uart-h{display:flex;justify-content:space-between;font:400 .62rem "JetBrains Mono",monospace;color:var(--mute);padding:.35rem .6rem;border-bottom:1px solid var(--line);letter-spacing:.06em}
.uart pre{margin:0;padding:.55rem .6rem;font-size:.68rem;line-height:1.55;height:calc(8 * 1.55em + 1.1rem);overflow:hidden;white-space:pre-wrap;word-break:break-all}
.uart pre::after{content:"_";color:var(--red-t);animation:blink 1s steps(1) infinite}
.uart pre span{display:block}
.uart pre span.new{animation:ln .9s ease-out}
@keyframes ln{from{background:color-mix(in srgb,var(--red) 22%,transparent);color:var(--red-t)}}

/* sections */
.sec{padding:3rem 0;border-bottom:1px solid var(--line)}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem 1rem;border-bottom:1px solid var(--ink);padding-bottom:.6rem;margin-bottom:1.5rem;flex-wrap:wrap;position:relative}
.sh::after{content:"";position:absolute;left:0;bottom:-2px;height:3px;width:4rem;background:var(--red);transition:width 1s cubic-bezier(.6,0,.2,1) .2s}
.anim .sh.rv:not(.in)::after{width:0}
.sh h2{margin:0;font-size:1.6rem;letter-spacing:-.02em;font-weight:700;display:flex;gap:.8rem;align-items:baseline}
.sh .no{font:500 .85rem "JetBrains Mono",monospace;color:var(--red-t)}
.sh .note{font:400 .68rem "JetBrains Mono",monospace;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.intro{padding:2.5rem 0 1rem}
.ph{font-size:clamp(2.6rem,7vw,4.6rem);letter-spacing:-.05em;line-height:.95;margin:.6rem 0 .8rem;font-weight:700}
.lede{max-width:40rem;color:var(--mute);margin:0;font-size:1.05rem}
.small{font-size:.72rem}
.mutet{color:var(--mute)}

.feat{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem}
ul.sq{list-style:none;padding:0;margin:0}
ul.sq li{padding:.6rem 0 .6rem 1.4rem;border-bottom:1px solid var(--line);position:relative}
ul.sq li::before{content:"";position:absolute;left:0;top:1.1rem;width:.45rem;height:.45rem;background:var(--red)}
.mini{font:500 .7rem "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:0 0 .3rem}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem}
.card{border:1px solid var(--line);background:var(--card);box-shadow:var(--sh1);padding:1.25rem;display:flex;flex-direction:column;gap:.55rem;min-width:0;position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--red) 9%,transparent),transparent 70%);opacity:0;transition:opacity .3s}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh3);border-color:var(--line2)}
.card:hover::before{opacity:1}
.card::after{content:"";position:absolute;top:0;left:0;height:3px;width:0;background:var(--red);transition:width .45s cubic-bezier(.6,0,.2,1)}
.card:hover::after{width:100%}
.card.wide{grid-column:span 2}
.card header{display:flex;justify-content:space-between;gap:.5rem;font:500 .68rem "JetBrains Mono",monospace;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.card header span:first-child{color:var(--red-t)}
.card h3{margin:.15rem 0 0;font-size:1.15rem;letter-spacing:-.01em}
.card p{margin:0;color:var(--mute);font-size:.92rem}
.row{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-top:auto}

/* RTC card */
.rtc{display:grid;grid-template-columns:1fr auto;gap:1rem 1.5rem;align-items:center}
.rtc .clock{font:700 clamp(2.4rem,5vw,3.6rem)/1 "JetBrains Mono",monospace;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.rtc .clock .ss{color:var(--red-t)}
.rtc .clock .col{animation:blink 1s steps(1) infinite}
.rtc .date{font:400 .74rem "JetBrains Mono",monospace;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin-top:.35rem}
.xtal{width:150px;height:56px;display:block;border:1px solid var(--line);background:var(--bg);box-shadow:inset 0 1px 4px rgb(var(--sc)/.12)}
.xtal path{fill:none;stroke:var(--red);stroke-width:1.6}
.xtal .gr{stroke:var(--line);stroke-width:1}
.xcap{font:400 .62rem "JetBrains Mono",monospace;color:var(--mute);text-align:center;margin-top:.3rem}
.regs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);margin-top:.4rem}
.regs div{padding:.5rem .7rem;border-right:1px solid var(--line);font:500 .8rem "JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.regs div:last-child{border-right:0}
.regs small{display:block;font-size:.58rem;color:var(--mute);letter-spacing:.08em;font-weight:400}

.tw{overflow-x:auto;overflow-y:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh1)}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem;min-width:38rem}
.tbl th{font:500 .66rem "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);text-align:left;border-bottom:1px solid var(--ink);padding:.6rem .75rem;white-space:nowrap}
.tbl td{padding:.6rem .75rem;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n{font-family:"JetBrains Mono",monospace;font-size:.8rem;white-space:nowrap}
.tbl td.n.r{color:var(--red-t);font-weight:700}
.tbl tbody tr:hover,.tbl tbody tr:focus{background:var(--faint);outline:none}
.fn{font:400 .7rem "JetBrains Mono",monospace;color:var(--mute);margin:.8rem 0 0}

.an{list-style:none;padding:0;margin:0}
.an a{display:grid;grid-template-columns:5.5rem 1fr auto 7rem;gap:1.25rem;align-items:baseline;padding:1rem .75rem;border-bottom:1px solid var(--line);text-decoration:none;position:relative;transition:background-color .2s,box-shadow .25s,transform .25s}
.an a:hover{background:var(--card);box-shadow:var(--sh2);transform:translateX(4px);z-index:1}
.an .t{transition:color .2s}
.an a:hover .t{color:var(--red-t)}
.an .id{font:500 .76rem "JetBrains Mono",monospace;color:var(--red-t)}
.an .t{font-weight:600;font-size:1.1rem;letter-spacing:-.01em}
.an .ex{display:block;color:var(--mute);font-size:.9rem;font-weight:400;letter-spacing:0}
.an .c{font:400 .68rem "JetBrains Mono",monospace;border:1px solid var(--line2);padding:.1rem .45rem;white-space:nowrap}
.an .d{font:400 .72rem "JetBrains Mono",monospace;color:var(--mute);text-align:right}

/* cluster */
.k8s{border:1px solid var(--ink);box-shadow:var(--sh2);background:var(--bg)}
.kctl{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;padding:.75rem;border-bottom:1px solid var(--ink);background:var(--faint)}
.kctl>span{margin-right:auto;font:500 .78rem "JetBrains Mono",monospace}
.kscale{display:flex;align-items:center;border:1px solid var(--ink)}
.kscale .btn{border:0;min-width:2.5rem}
.kscale output{font:700 .85rem "JetBrains Mono",monospace;min-width:2rem;text-align:center}
#kdrain[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.nodes{display:grid;grid-template-columns:repeat(3,1fr)}
.node{border-right:1px solid var(--line);padding:.9rem;transition:background-color .3s}
.node:last-child{border-right:0}
.node header{display:flex;align-items:center;gap:.5rem;font:400 .72rem "JetBrains Mono",monospace;margin-bottom:.7rem}
.nst{margin-left:auto;color:var(--mute)}
.nled{width:.5rem;height:.5rem;border-radius:50%;background:var(--ink)}
.node.cordon{background:repeating-linear-gradient(45deg,transparent 0 7px,var(--faint) 7px 14px)}
.node.cordon .nst{color:var(--red-t)}
.node.cordon .nled{background:var(--red)}
.pods{display:grid;grid-template-columns:repeat(auto-fill,2.4rem);gap:.4rem;min-height:2.4rem;align-content:start}
.pod{aspect-ratio:1;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);font:500 .58rem "JetBrains Mono",monospace;display:grid;place-items:center;cursor:pointer;padding:0;transition:background-color .2s,border-color .2s,opacity .4s,transform .4s,box-shadow .2s;box-shadow:0 2px 4px rgb(var(--sc)/.25)}
.pod:hover{background:var(--red);border-color:var(--red);color:#fff;transform:translateY(-2px);box-shadow:var(--shr)}
.pod.pending{background:transparent;color:var(--ink);border-style:dashed}
.pod.crash{background:var(--red);border-color:var(--red);color:#fff;animation:blink .3s steps(1) 4}
.pod.term{opacity:.15;transform:scale(.6)}
.anim .pod:not(.crash){animation:podin .35s cubic-bezier(.2,.8,.2,1)}
.kst{padding:.6rem .75rem;border-top:1px solid var(--line);margin:0;color:var(--mute)}
@keyframes podin{from{transform:scale(.3);opacity:0}}

/* work: rack */
.rack{border:1px solid var(--ink);padding:.6rem 2.1rem;position:relative;background:var(--faint);box-shadow:var(--sh3),inset 0 2px 10px rgb(var(--sc)/.12)}
.rack::before,.rack::after{content:"";position:absolute;top:0;bottom:0;width:1.3rem;background:radial-gradient(circle,var(--line2) 2px,transparent 2.6px) center/100% 1.1rem repeat-y}
.rack::before{left:0;border-right:1px solid var(--line2)}
.rack::after{right:0;border-left:1px solid var(--line2)}
.unit+.unit{margin-top:.4rem}
.face{width:100%;display:grid;grid-template-columns:auto 2.4rem 3.4rem 1fr auto auto auto;align-items:center;gap:1rem;padding:.8rem 1rem;background:var(--bg);border:1px solid var(--ink);color:var(--ink);font:inherit;text-align:left;cursor:pointer;box-shadow:0 2px 0 var(--line2),0 4px 10px -4px rgb(var(--sc)/.3);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.face:hover{background:var(--card);transform:translateX(6px);box-shadow:0 2px 0 var(--line2),0 10px 20px -6px rgb(var(--sc)/.35)}
.face[aria-expanded=true]{transform:translateX(14px)}
.face[aria-expanded=true]{border-color:var(--red);box-shadow:inset 4px 0 0 var(--red)}
.face .ear{width:.45rem;height:1.6rem;border:1px solid var(--line2);border-radius:2px}
.face .vent{width:4rem;height:1.2rem;background:repeating-linear-gradient(90deg,var(--line2) 0 2px,transparent 2px 6px)}
.uid{font:400 .68rem "JetBrains Mono",monospace;color:var(--mute)}
.ucode{font:700 .78rem "JetBrains Mono",monospace;color:var(--red-t)}
.utitle{font-weight:600}
.utitle small{display:block;font:400 .66rem "JetBrains Mono",monospace;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.leds{display:flex;gap:.35rem}
.leds i{width:.45rem;height:.45rem;border-radius:50%;background:var(--ink)}
.leds i.act{background:var(--red);animation:act 1s steps(1) infinite}
.spec{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.spec>div{overflow:hidden}
.face[aria-expanded=true]+.spec{grid-template-rows:1fr}
.spec p{margin:0 0 0 14px;padding:1rem 1.2rem 1rem 4.4rem;border:1px solid var(--line2);border-top:0;background:var(--bg);color:var(--mute);box-shadow:inset 0 6px 8px -6px rgb(var(--sc)/.25)}

.tim{overflow-x:auto;margin-bottom:1.25rem}
.timing{min-width:640px;width:100%;display:block}
.timing .g{stroke:var(--line);stroke-dasharray:2 4}
.timing .yr{font:400 10px "JetBrains Mono",monospace;fill:var(--mute)}
.timing .lbl{font:500 12px "JetBrains Mono",monospace;fill:var(--ink)}
.timing .w{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.6s ease both}
.timing .clk{stroke:var(--mute);stroke-width:1}
.timing .sig.hi .w{stroke:var(--red);stroke-width:2.6}
.timing .sig.hi .lbl{fill:var(--red-t)}
.timing .now{stroke:var(--red);stroke-dasharray:4 3}
.timing .nowt{fill:var(--red-t);font:500 10px "JetBrains Mono",monospace}

/* lab */
.lab{display:grid;grid-template-columns:1fr 1fr;gap:3rem}
.eq{font:500 1.25rem "JetBrains Mono",monospace;padding:1rem 1.2rem;border:1px solid var(--ink);border-left:4px solid var(--red);background:var(--card);box-shadow:var(--sh2)}
.eq sub{font-size:.6em;color:var(--mute)}
.rng{display:flex;justify-content:space-between;font:400 .78rem "JetBrains Mono",monospace;margin:1.6rem 0 .4rem}
input[type=range]{width:100%;accent-color:var(--red)}
.bits{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0 1.6rem}
.bits button{font:500 .78rem "JetBrains Mono",monospace;padding:.45rem .8rem;min-height:2.6rem;border:1px solid var(--ink);background:none;color:var(--ink);cursor:pointer}
.bits button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.big{font-size:clamp(3.2rem,8vw,5.2rem);font-weight:700;letter-spacing:-.05em;line-height:1}
.big span{color:var(--red)}
.big small{font-size:1.2rem;color:var(--mute);margin-left:.3rem;letter-spacing:0}
.reg{display:grid;grid-template-columns:repeat(16,1fr);border:1px solid var(--ink);margin:1.4rem 0 .3rem;box-shadow:var(--sh1)}
.reg i{height:1.6rem;border-right:1px solid var(--line);background:linear-gradient(90deg,var(--red) calc(var(--f,0) * 100%),transparent 0);transition:transform .25s}
.reg i.flip{animation:flip .4s ease}
@keyframes flip{50%{transform:scaleY(.2)}}
.big span{display:inline-block;transition:transform .2s}
.big span.bump{animation:pop .35s ease}
.reg i:last-child{border-right:0}
.reglbl{display:flex;justify-content:space-between;font:400 .62rem "JetBrains Mono",monospace;color:var(--mute)}
.bars{display:grid;gap:.5rem;margin-top:.5rem}
.bar{display:grid;grid-template-columns:3.4rem 1fr 4.8rem;align-items:center;gap:.75rem;font:400 .74rem "JetBrains Mono",monospace}
.bar .tr{height:.9rem;background:var(--faint);border:1px solid var(--line)}
.bar .tr i{display:block;height:100%;background:var(--ink);width:0;transition:width .35s}
.bar.on{font-weight:700;color:var(--red-t)}
.bar.on .tr i{background:var(--red)}
.bar .v{text-align:right}
.fits{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1rem}
.fits span{font:400 .7rem "JetBrains Mono",monospace;padding:.3rem .55rem;border:1px solid var(--line);color:var(--mute);text-decoration:line-through}
.fits span.ok{border-color:var(--ink);color:var(--ink);text-decoration:none}
.fits span.ok::before{content:"\25A0  ";color:var(--red)}

/* photo */
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:1.75rem 1.5rem}
.gal figure{margin:0;min-width:0;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.gal figure:hover{transform:translateY(-4px)}
.vf{display:block;width:100%;padding:0;border:0;background:#000;position:relative;cursor:crosshair;aspect-ratio:3/2;overflow:hidden;box-shadow:var(--sh2);transition:box-shadow .35s}
.gal figure:hover .vf{box-shadow:var(--sh3)}
.vf svg{display:block;width:100%;height:100%}
.vf .br{position:absolute;inset:8px;pointer-events:none;background:
linear-gradient(#fff,#fff) 0 0/14px 1.5px,linear-gradient(#fff,#fff) 0 0/1.5px 14px,
linear-gradient(#fff,#fff) 100% 0/14px 1.5px,linear-gradient(#fff,#fff) 100% 0/1.5px 14px,
linear-gradient(#fff,#fff) 0 100%/14px 1.5px,linear-gradient(#fff,#fff) 0 100%/1.5px 14px,
linear-gradient(#fff,#fff) 100% 100%/14px 1.5px,linear-gradient(#fff,#fff) 100% 100%/1.5px 14px;background-repeat:no-repeat;opacity:.75}
.vf .af{position:absolute;width:26px;height:26px;border:1.5px solid rgba(255,255,255,.85);left:50%;top:50%;transform:translate(-50%,-50%);transition:left .12s,top .12s,border-color .15s;pointer-events:none}
.vf.lock .af{border-color:var(--red);box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.vf .flash{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.vf .hud{position:absolute;left:14px;right:14px;bottom:10px;display:flex;justify-content:space-between;font:400 .6rem "JetBrains Mono",monospace;color:#fff;opacity:.85;pointer-events:none;text-shadow:0 1px 2px #000}
.vf .rec{color:#ff4b55}
.gal figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:.6rem 0;border-bottom:1px solid var(--line);font-size:.92rem}
.gal figcaption b{font-weight:600}
.gal figcaption span{font:400 .66rem "JetBrains Mono",monospace;color:var(--mute);white-space:nowrap}
.gal .fno{color:var(--red-t);font:500 .7rem "JetBrains Mono",monospace;margin-right:.4rem}

/* blog post */
.prog{position:fixed;left:0;top:0;height:3px;background:var(--red);width:0;z-index:30}
.back{display:inline-block;font:400 .75rem "JetBrains Mono",monospace;color:var(--mute);text-decoration:none;margin:2rem 0 1.25rem}
.back:hover{color:var(--red-t)}
.post{max-width:42rem;padding-bottom:3rem}
.post h1{font-size:clamp(2.1rem,5.5vw,3.3rem);letter-spacing:-.04em;line-height:1.04;margin:.6rem 0 1.25rem}
.anhead{border:1px solid var(--ink);display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);box-shadow:var(--sh1)}
.anhead div{padding:.55rem .8rem;border-right:1px solid var(--line);font:500 .76rem "JetBrains Mono",monospace}
.anhead div:last-child{border-right:0}
.anhead small{display:block;font-size:.6rem;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-weight:400}
.abstract{border-left:4px solid var(--red);padding:.8rem 1.1rem;background:var(--faint);margin:1.5rem 0 1rem;box-shadow:var(--sh1)}
.abstract small{font:500 .62rem "JetBrains Mono",monospace;color:var(--red-t);letter-spacing:.1em}
.abstract p{margin:.2rem 0 0;font-size:1.05rem}
.body p{font-size:1.07rem;line-height:1.75;margin:0 0 1.1rem}
.body h2{font-size:1.3rem;letter-spacing:-.01em;margin:2.2rem 0 .5rem;display:flex;gap:.6rem;align-items:baseline}
.body h2 span{font:500 .82rem "JetBrains Mono",monospace;color:var(--red-t)}
.body blockquote{margin:1.75rem 0;padding:.1rem 0 .1rem 1.2rem;border-left:3px solid var(--red)}
.body blockquote p{font-size:1.25rem;font-weight:500;line-height:1.45;letter-spacing:-.01em}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:3rem}
.pager a{border:1px solid var(--line2);padding:1rem;text-decoration:none;font-weight:500;background:var(--card);box-shadow:var(--sh1);transition:box-shadow .25s,transform .25s,border-color .25s}
.pager a:hover{border-color:var(--red);box-shadow:var(--sh2);transform:translateY(-2px)}
.pager small{display:block;font:400 .68rem "JetBrains Mono",monospace;color:var(--mute);margin-bottom:.2rem}
.pager .nx{text-align:right;grid-column:2}

/* forum */
.fbar{display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.chips{display:flex;gap:.35rem;flex-wrap:wrap}
.chips button{font:400 .72rem "JetBrains Mono",monospace;padding:.35rem .7rem;min-height:2.3rem;border:1px solid var(--line2);background:none;color:var(--mute);cursor:pointer}
.chips button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.threads{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.threads a{display:grid;grid-template-columns:3rem 1fr auto auto;gap:1rem;align-items:center;padding:.9rem .75rem;border-bottom:1px solid var(--line);text-decoration:none;position:relative;transition:background-color .2s,box-shadow .25s,transform .25s}
.threads a:hover{background:var(--card);box-shadow:var(--sh2);transform:translateX(4px);z-index:1}
.threads a:hover b{color:var(--red-t)}
.addr{font:400 .74rem "JetBrains Mono",monospace;color:var(--mute)}
.tt b{display:block;font-weight:600}
.tt small{font:400 .7rem "JetBrains Mono",monospace;color:var(--mute)}
.pinb{font:500 .62rem "JetBrains Mono",monospace;background:var(--red);color:#fff;padding:.15rem .45rem;text-transform:uppercase;letter-spacing:.06em}
.rc{font:700 .85rem "JetBrains Mono",monospace;min-width:2.3rem;height:2.3rem;display:grid;place-items:center;border:1.5px solid var(--red);color:var(--red-t)}
.frames{list-style:none;padding:0;margin:1.5rem 0}
.frames li{border:1px solid var(--line2);margin-bottom:.75rem;background:var(--card);box-shadow:var(--sh1)}
.frames header{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;padding:.5rem .8rem;border-bottom:1px solid var(--line);font:400 .7rem "JetBrains Mono",monospace;color:var(--mute);background:var(--faint)}
.frames header b{color:var(--ink);font-weight:700}
.frames header .t{margin-left:auto}
.role{padding:.05rem .4rem;border:1px solid var(--line2)}
.role.r-admin{background:var(--red);border-color:var(--red);color:#fff}
.role.r-moderator{border-color:var(--ink);color:var(--ink)}
.frames p{margin:0;padding:.85rem}
.reply,dialog form{display:grid;gap:.6rem}
.reply label,dialog label{font:500 .7rem "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
input[type=text],textarea,select{font:inherit;width:100%;border:1px solid var(--ink);background:var(--bg);color:var(--ink);padding:.6rem .7rem;border-radius:0}
dialog{border:1px solid var(--ink);background:var(--bg);color:var(--ink);padding:0;max-width:32rem;width:calc(100% - 2rem);box-shadow:var(--sh3)}
dialog[open]{animation:dlg .3s cubic-bezier(.2,.8,.2,1)}
@keyframes dlg{from{opacity:0;transform:translateY(14px) scale(.98)}}
dialog::backdrop{background:rgba(10,10,12,.55)}
dialog form{padding:1.25rem}
dialog h2{margin:0 0 .4rem;font-size:1.3rem}

/* footer */
.foot{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding-top:1.5rem;padding-bottom:3rem;border-top:2px solid var(--ink)}
.foot b{font-size:1.1rem;letter-spacing:-.02em}

/* launch */
.launch{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.launch .count{position:absolute;left:0;right:0;top:34%;text-align:center;font:700 clamp(3rem,11vw,7.5rem)/1 "JetBrains Mono",monospace;color:var(--red);letter-spacing:-.05em}
.rocket{position:absolute;left:50%;bottom:-24px;width:64px;transform:translateX(-50%)}
.rocket .flame{transform-box:view-box;transform-origin:30px 132px;opacity:0}
.rocket.go .flame{opacity:1;animation:flk .07s infinite alternate}
.puff{position:absolute;bottom:-30px;left:50%;width:70px;height:70px;margin-left:-35px;border-radius:50%;background:var(--line2)}

@keyframes hb{0%,45%,100%{opacity:1}22%{opacity:.25}}
@keyframes blink{50%{opacity:0}}
@keyframes act{50%{opacity:.15}}
@keyframes flow{to{stroke-dashoffset:-.1}}
@keyframes drawin{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(105%)}}
@keyframes pop{40%{transform:scale(1.45)}70%{transform:scale(.9)}}
@keyframes rule{from{width:0}}
@keyframes tick{to{transform:translateX(-50%)}}
@keyframes mup{from{opacity:0;transform:translateY(-6px)}}
@keyframes wag{from{transform:rotate(-16deg)}to{transform:rotate(18deg)}}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes flk{to{transform:scale(.9,1.3)}}
@keyframes rf{0%{opacity:.15}15%{opacity:1}30%{opacity:.35}45%{opacity:1}60%{opacity:.6}75%{opacity:1}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}

/* landing motion (html.anim is set only when motion is allowed) */
.anim .wm .ch{animation:rise .85s cubic-bezier(.2,.85,.2,1) both;animation-delay:calc(var(--i) * 55ms + .1s)}
.anim .wm .dot{animation:rise .85s cubic-bezier(.2,.85,.2,1) both,pop .5s ease 1.25s;animation-delay:calc(var(--i) * 55ms + .1s),1.25s}
.anim .wm-rule{animation:rule 1.1s cubic-bezier(.6,0,.2,1) .55s both}
.anim .hero-l>.fi{animation:fade .6s ease both;animation-delay:calc(.9s + var(--k,0) * 90ms)}
.chip.intro .stub{animation:fade .3s .35s both}
.chip.intro .body,.chip.intro .ct,.chip.intro .p1{animation:fade .5s .2s both}
.chip.intro .tr,.chip.intro .trd{stroke-dasharray:1;stroke-dashoffset:1;animation:drawin .8s ease forwards;animation-delay:calc(.6s + var(--d,0s))}
.chip.intro .pad,.chip.intro .via,.chip.intro .net,.chip.intro text.l{animation:fade .4s both;animation-delay:calc(1.3s + var(--d,0s))}
.chip.intro .led{animation:fade .3s 2.2s both}
.rv{opacity:0;translate:0 18px;transition:opacity .6s ease var(--rd,0ms),translate .7s cubic-bezier(.2,.8,.2,1) var(--rd,0ms),transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s}
.rv.in{opacity:1;translate:none}

.ticker{overflow:hidden;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:.65rem 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.ticker>div{display:flex;align-items:center;width:max-content;animation:tick 50s linear infinite;font:500 .74rem "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.ticker span,.ticker i{margin-right:1.3rem}
.ticker i{width:.4rem;height:.4rem;background:var(--red);flex:none}
.ticker:hover>div{animation-play-state:paused}

.menu-btn{display:none}

/* live feeds */
.feeds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.25rem}
.feed{min-height:12rem}
.feed:hover{transform:none}
.feed.tall{grid-row:span 2}
.feed.w2{grid-column:span 2}
.feed.w3{grid-column:1/-1}
.feed.w3 .fl{display:grid;grid-template-columns:1fr 1fr;column-gap:1px}
.feed .fb{flex:1;display:flex;flex-direction:column;min-width:0;margin:0 -1.25rem}
.fsrc{display:flex;align-items:center;gap:.4rem;text-transform:none!important;letter-spacing:0!important}
.fdot{width:.5rem;height:.5rem;border-radius:50%;background:var(--line2);flex:none}
.fdot.live{background:var(--red);animation:hb 1.8s infinite}
.fdot.warn{background:#c99a2e}
.feed.picked{border-color:var(--red)}
.pick[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.fsk{height:.7rem;margin:.7rem 1.25rem;background:linear-gradient(90deg,var(--faint) 25%,var(--line) 50%,var(--faint) 75%);background-size:300% 100%;animation:fsk 1.4s linear infinite}
@keyframes fsk{to{background-position:-150% 0}}
.fmsg{padding:.6rem 1.25rem;font:400 .74rem "JetBrains Mono",monospace;color:var(--mute);display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.gwrap{position:relative;flex:1;min-height:21rem;touch-action:none;cursor:grab;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:16px 16px}
.gwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.gctl{position:absolute;left:.7rem;bottom:.7rem;z-index:1}
.ghint{position:absolute;right:.7rem;top:.5rem;font:400 .62rem "JetBrains Mono",monospace;color:var(--mute)}
#gfollow[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.gread{display:grid;grid-template-columns:repeat(4,1fr)}
.gread div{padding:.5rem 1.25rem .2rem;font:500 .8rem "JetBrains Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gread div+div{padding-left:.4rem}
.gread small{display:block;font-size:.58rem;color:var(--mute);letter-spacing:.08em}
.fl{list-style:none;margin:0;padding:0}
.fl li{border-top:1px solid var(--line)}
.fl li>a,.fl li>div{display:grid;grid-template-columns:2rem 1fr auto;gap:.7rem;align-items:baseline;padding:.55rem 1.25rem;text-decoration:none}
.fl li>a:hover{background:var(--faint)}
.fl li>a:hover b{color:var(--red-t)}
.fl .i{font:500 .68rem "JetBrains Mono",monospace;color:var(--red-t)}
.fl b{font-weight:500;font-size:.9rem;line-height:1.35;display:block}
.fl small{font:400 .64rem "JetBrains Mono",monospace;color:var(--mute)}
.fl .v{font:600 .74rem "JetBrains Mono",monospace;white-space:nowrap;text-align:right}
.fl .v.r{color:var(--red-t)}
.tm{font:700 .95rem "JetBrains Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.go{font:700 .6rem "JetBrains Mono",monospace;padding:.1rem .4rem;border:1px solid var(--line2);letter-spacing:.06em}
.go.y{background:var(--red);border-color:var(--red);color:#fff}
.fl li.on>div,.fl li.on>a{background:color-mix(in srgb,var(--red) 7%,transparent)}
.fl button.padb{all:unset;cursor:pointer;display:block;min-width:0}
.fl button.padb:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.fbig{display:flex;align-items:baseline;gap:.6rem;padding:.2rem 1.25rem .6rem;flex-wrap:wrap}
.fbig b{font-size:2.6rem;font-weight:700;letter-spacing:-.04em;line-height:1}
.fbig b.r{color:var(--red)}
.fbig span{font:400 .72rem "JetBrains Mono",monospace;color:var(--mute)}
.kpb{display:block;width:calc(100% - 2.5rem);height:70px;margin:0 1.25rem .6rem}
.kpb rect{fill:var(--ink)}
.kpb rect.r{fill:var(--red)}
.kpb line{stroke:var(--red);stroke-dasharray:3 3}
.led3{width:.6rem;height:.6rem;border-radius:50%;background:var(--ink);display:inline-block}
.led3.ok{background:#3c9a5f;box-shadow:0 0 6px #3c9a5f}
.led3.minor{background:#c99a2e;box-shadow:0 0 6px #c99a2e}
.led3.major,.led3.critical{background:var(--red);box-shadow:0 0 8px var(--red);animation:hb 1s infinite}
.nbar{height:.5rem;background:var(--faint);border:1px solid var(--line);margin-top:.3rem}
.nbar i{display:block;height:100%;background:var(--ink)}
.fl li:first-child .nbar i{background:var(--red)}
.picked-bar{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin-top:1rem}

@media (max-width:62rem){
  .feeds{grid-template-columns:1fr 1fr}
  .cards{grid-template-columns:1fr 1fr}
  .chip{transform:none}
  .gal{grid-template-columns:1fr 1fr}
  .lab{grid-template-columns:1fr}
}
@media (max-width:48rem){
  .top .wrap{position:relative;gap:.75rem}
  .menu-btn{display:grid;align-content:center;justify-items:center;gap:5px;width:2.75rem;height:2.75rem;border:1px solid var(--ink);background:none;color:var(--ink);cursor:pointer;padding:0}
  .menu-btn span{display:block;width:1.1rem;height:2px;background:currentColor;transition:transform .25s}
  .menu-btn[aria-expanded=true] span:first-child{transform:translateY(3.5px) rotate(45deg)}
  .menu-btn[aria-expanded=true] span:last-child{transform:translateY(-3.5px) rotate(-45deg)}
  .top nav{position:absolute;top:100%;left:0;right:0;background:var(--bg);border-bottom:2px solid var(--ink);visibility:hidden;opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s,visibility 0s .2s}
  .top nav.open{visibility:visible;opacity:1;transform:none;transition:opacity .2s,transform .2s}
  .top nav.open li{animation:mup .3s both;animation-delay:calc(var(--n) * 40ms)}
  .nav{flex-direction:column;padding:.25rem 1.5rem 1rem;gap:0}
  .nav a{padding:1rem 0;font-size:1rem;border-bottom:1px solid var(--line);gap:1rem}
  .nav a[aria-current=page]{border-bottom-color:var(--line);color:var(--red-t)}
  .sw{margin-left:auto}
  .sw .swl{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  .runhead,.uart,.fw,.feat>div,.hint{display:none}
  .hero{padding-top:1.75rem}
  .hero-g{grid-template-columns:1fr;gap:2rem}
  .nodes{grid-template-columns:1fr}
  .node{border-right:0;border-bottom:1px solid var(--line)}
  .ctas .btn{flex:1}
  .chip{max-width:340px}
  .feat,.cards,.gal,.feeds{grid-template-columns:1fr}
  .feed.w2,.feed.tall,.feed.w3{grid-column:auto;grid-row:auto}
  .feed.w3 .fl{grid-template-columns:1fr}
  .gread{grid-template-columns:1fr 1fr}
  .ghint{display:none}
  .card.wide{grid-column:auto}
  .rtc{grid-template-columns:1fr}
  .an a{grid-template-columns:1fr auto;gap:.3rem 1rem}
  .an .t{grid-column:1/-1;grid-row:2}
  .an .c{display:none}
  .an .d{grid-row:1}
  .face{grid-template-columns:3rem 1fr auto;gap:.75rem}
  .face .ear,.face .uid,.face .vent{display:none}
  .spec p{padding-left:1.2rem}
  .threads a{grid-template-columns:1fr auto;gap:.5rem}
  .addr,.threads .pinb{display:none}
  .anhead{grid-template-columns:1fr 1fr}
  .anhead div:nth-child(2){border-right:0}
  .anhead div:last-child{grid-column:1/-1;border-top:1px solid var(--line)}
  .pager{grid-template-columns:1fr}
  .pager .nx{grid-column:1}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<a class="skip" href="#app" id="skip">Skip to content</a>
<header class="top"><div class="wrap">
  <a class="brand" href="#/" aria-label="vije.sh, overview"><span class="led" aria-hidden="true"></span>vije.sh<small>VKG-04</small></a>
  <nav aria-label="Main" id="nav"><ul class="nav">
    <li style="--n:0"><a href="#/" data-p=""><i>P1</i>Overview</a></li>
    <li style="--n:1"><a href="#/work" data-p="work"><i>P2</i>Work</a></li>
    <li style="--n:2"><a href="#/lab" data-p="lab"><i>P3</i>Lab</a></li>
    <li style="--n:3"><a href="#/photo" data-p="photo"><i>P4</i>Photo</a></li>
    <li style="--n:4"><a href="#/blog" data-p="blog"><i>P5</i>Blog</a></li>
    <li style="--n:5"><a href="#/forum" data-p="forum"><i>P6</i>Forum</a></li>
    <li style="--n:6"><a href="#/live" data-p="live"><i>P7</i>Live</a></li>
  </ul></nav>
  <button class="sw" id="theme" type="button" aria-pressed="false"><span class="track" aria-hidden="true"><span class="knob"></span></span><span class="swl">Dark</span></button>
  <button class="menu-btn" id="menu" type="button" aria-expanded="false" aria-controls="nav" aria-label="Menu"><span></span><span></span></button>
</div></header>

<main id="app" class="wrap" tabindex="-1"></main>

<footer class="wrap foot">
  <div><b>vije.sh</b> <span class="mono small mutet">VKG-04 &middot; Rev 30.1 &middot; built from the bootloader up</span></div>
  <div class="row"><span class="mono small mutet hint">or type <kbd>launch</kbd> anywhere</span><button class="btn red sm" id="launch" type="button">Launch &uarr;</button></div>
</footer>

<script src="../shared/content.js"></script>
<script>
(() => {
  const V = window.VIJE, { esc, store, posts, fmtDate, RM } = V;
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const app = $('#app'), forum = V.forum('v181-forum');
  const reduce = () => RM.matches;
  const NS = 'http://www.w3.org/2000/svg';
  document.documentElement.classList.toggle('anim', !reduce());
  let cleanups = [], first = true;
  const later = f => cleanups.push(f);

  /* ---------- UART console ---------- */
  const log = [];
  let fresh = false;
  const paintUart = () => {
    const el = $('#uart-out'); if (!el) return;
    const l = log.slice(-8);
    el.innerHTML = l.map((m, i) => `<span${fresh && i === l.length - 1 && !reduce() ? ' class="new"' : ''}>${esc(m)}</span>`).join('');
    fresh = false;
  };
  function uart(m) { log.push(m); if (log.length > 30) log.shift(); fresh = true; paintUart(); }
  let booted = false;
  function boot() {
    if (booted) return paintUart();
    booted = true;
    const lines = ['ESP-ROM:vkg04-20261006', 'vije.sh bootloader v30.1', 'psram: 8 yrs experience mapped',
      `fs: mounted /blog (${posts.length} notes)`, 'k8s: 3/3 nodes Ready', 'rtc: 32.768 kHz xtal locked', 'net: link up, https only', 'ready. type "launch" anywhere.'];
    if (reduce()) return lines.forEach(uart);
    lines.forEach((l, i) => setTimeout(() => uart(l), 300 + i * 240));
  }

  /* ---------- shared bits ---------- */
  const runhead = label => `<div class="runhead"><span>VKG-04 &middot; Personal Systems Processor</span><span>${label} &middot; Rev 30.1 &middot; Oct 2026</span></div>`;
  const runfoot = n => `<div class="runfoot"><span>vije.sh &middot; VKG-04 datasheet</span><span>Page ${n} of 7</span></div>`;
  const h2 = (no, t, note = '') => `<div class="sh"><h2><span class="no">${no}</span>${t}</h2>${note ? `<span class="note">${note}</span>` : ''}</div>`;
  const an = i => String(posts.length - i).padStart(3, '0');
  const noteRow = (p, i) => `<li><a href="#/blog/${encodeURIComponent(p.slug)}"><span class="id">AN-${an(i)}</span><span class="t">${esc(p.title)}<span class="ex">${esc(p.excerpt)}</span></span><span class="c">${esc(p.cat)}</span><span class="d">${fmtDate(p.date)}</span></a></li>`;

  const TAGS = [V.identity.tagline, 'Firmware by night, backends by day.', 'Small models, big ideas, tiny RAM.', 'Built from the bootloader up.', 'Compiles first try. Sometimes.'];
  const fw = store.get('v181-fw', { v: 0 });
  const tagOf = () => TAGS[fw.v % TAGS.length];

  /* ---------- chip pinout ---------- */
  function chipSVG(active) {
    const left = [['', 'Overview'], ['work', 'Work'], ['lab', 'Lab']], right = [['photo', 'Photo'], ['blog', 'Blog'], ['forum', 'Forum']];
    const cs = [146, 164, 182, 200, 218, 236, 254];
    const nets = ['VCC', 'CLK', 'RST', 'TX'], gnd = ['GND', 'RX', 'SDA'];
    let s = `<svg class="chip${reduce() ? '' : ' intro'}" viewBox="0 0 400 400" role="group" aria-label="Pinout: each labelled pin links to a page">`;
    cs.forEach((c, k) => {
      s += `<rect class="stub" x="${c - 3}" y="118" width="6" height="12"/><rect class="stub" x="${c - 3}" y="270" width="6" height="12"/>`;
      if (k % 2 === 0) {
        const x = c + (k - 3) * 14, y = 34 + (k * 13) % 28, n = nets[k / 2];
        s += `<g style="--d:${(k * .08).toFixed(2)}s"><path class="trd" pathLength="1" d="M${c} 118 V104 L${x} 90 V${y + 6}"/><circle class="via" cx="${x}" cy="${y}" r="5"/><text class="net" x="${x}" y="${y - 9}" text-anchor="middle">${n}</text></g>`;
      } else {
        const x = c + (k - 3) * 14, y = 350 + (k * 11) % 24, n = gnd[(k - 1) / 2];
        s += `<g style="--d:${(.1 + k * .08).toFixed(2)}s"><path class="trd" pathLength="1" d="M${c} 282 V296 L${x} 310 V${y - 6}"/><circle class="via" cx="${x}" cy="${y}" r="5"/><text class="net" x="${x}" y="${y + 16}" text-anchor="middle">${n}</text></g>`;
      }
      if (k % 2 === 0) {
        s += `<rect class="stub" x="118" y="${c - 3}" width="12" height="6"/><rect class="stub" x="270" y="${c - 3}" width="12" height="6"/>`;
      } else {
        const i = (k - 1) / 2, [lr, ll] = left[i], [rr, rl] = right[i];
        s += `<a class="pin${active === lr ? ' on' : ''}" href="#/${lr}" aria-label="P${i + 1}: ${ll}" style="--d:${(.15 + i * .12).toFixed(2)}s"><rect class="hit" x="0" y="${c - 18}" width="130" height="28"/><rect class="stub" x="118" y="${c - 3}" width="12" height="6"/><path class="tr" pathLength="1" d="M118 ${c} H34"/><circle class="pad" cx="27" cy="${c}" r="6"/><text class="l" x="112" y="${c - 6}" text-anchor="end">${ll.toUpperCase()}</text><text class="pnum" x="136" y="${c + 3}">P${i + 1}</text></a>`;
        s += `<a class="pin${active === rr ? ' on' : ''}" href="#/${rr}" aria-label="P${i + 4}: ${rl}" style="--d:${(.2 + i * .12).toFixed(2)}s"><rect class="hit" x="270" y="${c - 18}" width="130" height="28"/><rect class="stub" x="270" y="${c - 3}" width="12" height="6"/><path class="tr" pathLength="1" d="M282 ${c} H366"/><circle class="pad" cx="373" cy="${c}" r="6"/><text class="l" x="288" y="${c - 6}">${rl.toUpperCase()}</text><text class="pnum" x="264" y="${c + 3}" text-anchor="end">P${i + 4}</text></a>`;
      }
    });
    s += `<rect class="body" x="130" y="130" width="140" height="140" rx="6"/><circle class="p1" cx="146" cy="146" r="4"/>
      <text class="ct" x="200" y="196" font-size="24" font-weight="700">VKG-04</text><text class="ct" x="200" y="216" font-size="11">vije.sh</text><text class="ct" x="200" y="234" font-size="8" opacity=".6">2641 &#183; RED &#183; e3</text>
      <path class="trd" pathLength="1" style="--d:.9s" d="M330 254 V300"/><circle class="led" cx="330" cy="310" r="7"/><text class="net" x="342" y="313">D1</text></svg>`;
    return s;
  }

  /* ---------- real-time clock card ---------- */
  const RTC = `<article class="card wide" id="rtc"><header><span>RTC</span><span>Real-time clock &middot; 32.768 kHz</span></header>
    <div class="rtc"><div><div class="clock" id="clk" aria-hidden="true">00<span class="col">:</span>00<span class="col">:</span><span class="ss">00</span></div><p class="date" id="cdate"></p></div>
    <div><svg class="xtal" viewBox="0 0 150 56" aria-hidden="true"><path class="gr" d="M0 28H150M37.5 0V56M75 0V56M112.5 0V56"/><path id="xw" d=""/></svg><p class="xcap">XTAL &middot; 32.768 kHz</p></div></div>
    <h3>Always on time</h3><p>Keeps time while everything else sleeps. Career uptime counts from the first commit in 2017.</p>
    <div class="regs"><div><small>CAREER UPTIME</small><span id="rup">&mdash;</span></div><div><small>THIS SESSION</small><span id="rses">0 s</span></div><div><small>TIMEZONE</small><span id="rtz">&mdash;</span></div></div>
  </article>`;
  const t0Session = Date.now();

  /* ---------- pages ---------- */
  function pOverview() {
    const codes = [['GFX', 'Godot 4'], ['GPIO', 'ESP32-C3'], ['NPU', 'int4 / ternary'], ['GPU', 'next upgrade']];
    const cards = V.outside.map(([t, d], i) => `<article class="card"><header><span>${codes[i][0]}</span><span>${codes[i][1]}</span></header><h3>${esc(t)}</h3><p>${esc(d)}</p></article>`).join('');
    const ch = (s, o) => [...s].map((c, i) => `<span class="ch${c === '.' ? ' dot' : ''}" style="--i:${i + o}">${c}</span>`).join('');
    const tick = ['8 yrs backend', 'MSc ML & AI', 'Node.js', 'React', 'GCP', 'Istio', 'Godot', 'Kubernetes', 'Linux', 'ESP32-C3', 'Custom firmware', 'Robotics', 'Rockets', 'Local AI', 'Servers', 'Photography', 'Motorcycles', 'Good dog']
      .map(t => `<span>${esc(t)}</span><i></i>`).join('');
    return `${runhead('Datasheet')}
    <section class="hero">
      <div class="hero-g">
      <div class="hero-l">
        <p class="pn">Part no. VKG-04-RED &middot; QFN-28 &middot; Rev 30.1</p>
        <h1 class="wm" tabindex="-1" aria-label="vije.sh"><span class="wmi" aria-hidden="true">${ch('vije.sh', 0)}</span></h1>
        <div class="wm-rule" aria-hidden="true"></div>
        <p class="sub fi" style="--k:0">Personal Systems Processor</p>
        <p class="tag fi" id="tag" aria-live="polite" style="--k:1">${esc(tagOf())}</p>
        <p class="bio fi" style="--k:2">${esc(V.identity.bio)}</p>
        <div class="ctas fi" style="--k:3"><a class="btn red" href="#/blog">Read the blog</a><a class="btn" href="#/forum">Visit the forum</a></div>
        <div class="fw fi" style="--k:4"><span class="mutet">FIRMWARE</span><b id="fwv">v30.1.${fw.v}</b><span class="fwbar" aria-hidden="true"><i id="fwbar"></i></span><button class="btn sm" id="flash" type="button">Flash v30.1.${fw.v + 1}</button></div>
      </div>
      <div class="hero-r">
        ${chipSVG('')}
        <div class="uart"><div class="uart-h"><span>UART0 &middot; /dev/ttyVKG0</span><span>115200 8N1</span></div><pre id="uart-out"></pre></div>
      </div>
      </div>
    </section>
    <div class="ticker" aria-hidden="true"><div>${tick}${tick}</div></div>
    <section class="sec">${h2(1, 'Features')}
      <div class="feat">
        <ul class="sq">
          <li>Software engineer first: ${esc(V.identity.stats[0])} of distributed backend systems, security and tooling</li>
          <li>Part-time sysadmin, full-time Kubernetes wizard: clusters, meshes, servers</li>
          <li>${esc(V.identity.stats[1])}, with a soft spot for small, efficient models</li>
          <li>Native support for ${V.identity.stats.slice(2).map(esc).join(', ')}</li>
          <li>Custom firmware and hardware: microcontrollers, sensors, robots</li>
          <li>Integrated camera, motorcycle and one very good dog</li>
        </ul>
        <div><p class="mini">Typical applications</p>
        <ul class="sq"><li>Platform engineering and API gateways</li><li>Clusters that heal themselves</li><li>Access control you can audit</li><li>Local AI on modest hardware</li><li>Things that blink, beep or launch</li></ul></div>
      </div>
    </section>
    <section class="sec">${h2(2, 'Cluster', 'kubectl get pods -w')}
      <p class="lede" style="margin-bottom:1.25rem">Software engineer by title, sysadmin by habit. This cluster heals itself: click a pod to kill it, drain a node or scale the deployment, and watch it reconcile.</p>
      <div class="k8s">
        <div class="kctl"><span>deployment/vije-web</span>
          <div class="kscale" role="group" aria-label="Replicas"><button class="btn sm" id="kdn" type="button" aria-label="Scale down">&minus;</button><output id="krep">6</output><button class="btn sm" id="kup" type="button" aria-label="Scale up">+</button></div>
          <button class="btn sm" id="kchaos" type="button">Chaos: kill a pod</button>
          <button class="btn sm" id="kdrain" type="button" aria-pressed="false">Drain node-b</button></div>
        <div class="nodes">${['node-a', 'node-b', 'node-c'].map(n => `<div class="node" data-n="${n}"><header><i class="nled" aria-hidden="true"></i><b>${n}</b><span class="nst">Ready</span></header><div class="pods"></div></div>`).join('')}</div>
        <p class="kst mono small" id="kst"></p>
      </div>
    </section>
    <section class="sec">${h2(3, 'Live telemetry', '<a href="#/live">All live feeds &rarr;</a>')}
      <div class="feeds" id="feeds-home">${pickedFeeds().map(k => feedCard(k)).join('')}</div>
    </section>
    <section class="sec">${h2(4, 'Peripherals', 'Outside work')}
      <div class="cards">${cards}${RTC}</div>
    </section>
    <section class="sec">${h2(5, 'Latest application notes', `<a href="#/blog">All notes &rarr;</a>`)}
      <ol class="an">${posts.slice(0, 3).map(noteRow).join('')}</ol>
    </section>
    <section class="sec">${h2(6, 'Absolute maximum ratings', 'T<sub>A</sub> = 25 &deg;C unless noted')}
      <div class="tw"><table class="tbl"><thead><tr><th>Parameter</th><th>Symbol</th><th>Min</th><th>Typ</th><th>Max</th><th>Unit</th></tr></thead><tbody>
        <tr><td>Coffee intake</td><td><i>I</i><sub>coffee</sub></td><td class="n">1</td><td class="n">3</td><td class="n">5</td><td class="n">cups/day</td></tr>
        <tr><td>Dog walks</td><td><i>N</i><sub>walk</sub></td><td class="n">2</td><td class="n">3</td><td class="n">&mdash;</td><td class="n">per day</td></tr>

  function mountCluster() {
    const root = $('.k8s'), kst = $('#kst'), nodes = ['node-a', 'node-b', 'node-c'], cordon = new Set(), pods = [];
    const ST = { pending: 'Pending', run: 'Running', crash: 'CrashLoopBackOff', term: 'Terminating' };
    let want = 6, restarts = 0, vis = false;
    const live = () => pods.filter(p => p.state !== 'term');
    const on = n => live().filter(p => p.node === n).length;
    const status = () => {
      const l = live();
      kst.textContent = `${l.filter(p => p.state === 'run').length}/${want} ready \u00b7 ${l.filter(p => p.state === 'pending').length} pending \u00b7 restarts ${restarts} \u00b7 ${3 - cordon.size}/3 nodes schedulable`;
    };
    const set = p => {
      p.el.className = 'pod' + ({ pending: ' pending', run: '', crash: ' crash', term: ' term' })[p.state];
      p.el.setAttribute('aria-label', `Pod ${p.id} on ${p.node}, ${ST[p.state]}. Delete pod.`);
      status();
    };
    const make = () => {
      const node = nodes.filter(n => !cordon.has(n)).sort((a, b) => on(a) - on(b))[0];
      const p = { id: 'web-' + (Math.random() * 4096 | 0).toString(16).padStart(3, '0'), node, state: 'pending' };
      p.el = document.createElement('button'); p.el.type = 'button'; p.el.textContent = p.id.slice(4);
      p.el.onclick = () => kill(p, 'deleted by guest');
      $(`.node[data-n="${node}"] .pods`, root).append(p.el); pods.push(p); set(p);
      setTimeout(() => { if (p.state === 'pending') { p.state = 'run'; set(p); } }, 600 + Math.random() * 600);
      uart(`k8s: scheduled ${p.id} on ${node}`);
    };
    function kill(p, why) {
      if (p.state === 'term') return;
      p.state = 'term'; set(p); uart(`k8s: ${p.id} ${why}`);
      setTimeout(() => { p.el.remove(); pods.splice(pods.indexOf(p), 1); status(); }, 500);
    }
    const reconcile = () => {
      live().forEach(p => { if (cordon.has(p.node)) kill(p, `evicted from ${p.node}`); });
      const l = live();
      if (l.length < want) make(); else if (l.length > want) kill(l[l.length - 1], 'scaled down');
    };
    const crash = () => {
      const r = live().filter(p => p.state === 'run');
      if (!r.length) return;
      const p = r[Math.floor(Math.random() * r.length)];
      p.state = 'crash'; restarts++; set(p); uart(`k8s: ${p.id} CrashLoopBackOff, restarting`);
      setTimeout(() => { if (p.state === 'crash') { p.state = 'run'; set(p); } }, 1800);
    };
    const io = new IntersectionObserver(e => { vis = e[0].isIntersecting; }, { threshold: .3 });
    io.observe(root);
    const loop = setInterval(() => { if (vis && !document.hidden) reconcile(); }, 320);
    const chaos = setInterval(() => { if (vis && !document.hidden) crash(); }, 7000);
    const scale = d => { want = Math.max(1, Math.min(12, want + d)); $('#krep').textContent = want; status(); uart(`k8s: scaled vije-web to ${want}`); };
    $('#kup').onclick = () => scale(1);
    $('#kdn').onclick = () => scale(-1);
    $('#kchaos').onclick = () => { const l = live(); if (l.length) kill(l[Math.floor(Math.random() * l.length)], 'killed by chaos monkey'); };
    const dr = $('#kdrain'), nb = $('.node[data-n="node-b"]', root);
    dr.onclick = () => {
      const c = !cordon.has('node-b');
      c ? cordon.add('node-b') : cordon.delete('node-b');
      dr.setAttribute('aria-pressed', c); dr.textContent = c ? 'Uncordon node-b' : 'Drain node-b';
      nb.classList.toggle('cordon', c); $('.nst', nb).textContent = c ? 'SchedulingDisabled' : 'Ready';
      uart(`k8s: node-b ${c ? 'cordoned and drained' : 'uncordoned'}`); status();
    };
    status();
    later(() => { clearInterval(loop); clearInterval(chaos); io.disconnect(); });
  }

      ${picker ? `<div class="row"><button class="btn sm pick" type="button" data-f="${k}" aria-pressed="${on}">${on ? 'On overview' : 'Add to overview'}</button></div>` : ''}</article>`;
  };
  function mountFeeds(root) {
    let alive = true; later(() => { alive = false; });
    $$('.feed', root).forEach(c => {
      const k = c.dataset.f, f = FEEDS[k], dot = $('.fdot', c), st = $('.fst', c), body = $('.fbody', c);
      const ok = r => { dot.className = 'fdot ' + (r.src === 'stale' ? 'warn' : 'live'); st.textContent = r.src === 'live' ? 'LIVE' : `${r.src === 'stale' ? 'STALE' : 'CACHED'} ${ago(r.t)}`; };
      const fail = () => {
        dot.className = 'fdot warn'; st.textContent = 'NO SIGNAL';
        if (body) { body.innerHTML = `<p class="fmsg">No signal from ${f.host}.<button class="btn sm" type="button">Retry</button></p>`; $('button', body).onclick = () => { body.innerHTML = sk(4); run(); }; }
      };
      const run = () => Promise.resolve().then(() => f.mount(c, ok, fail, () => alive, body)).catch(() => alive && fail());
      run();
    });
  }
  function pLive() {
    return `${runhead('Live feeds')}
    <section class="intro"><p class="pn">Section 12</p><h1 class="ph" tabindex="-1">Live feeds</h1><p class="lede">Real data from free public APIs with no keys, cached in this browser so the rate limits hold. LF-01 to LF-03 are on the overview; add or remove any feed and the overview follows.</p>
      <div class="picked-bar"><span class="mono small" id="picked"></span><button class="btn sm" type="button" id="preset">Reset to LF-01 to LF-03</button></div></section>
    <section class="sec">${h2(12, 'Feed catalogue', `${Object.keys(FEEDS).length} feeds`)}<div class="feeds">${Object.keys(FEEDS).map(k => feedCard(k, true)).join('')}</div></section>
    ${runfoot(7)}`;
  }
  function mountLive() {
    const paint = () => {
      const p = pickedFeeds();
      $('#picked').textContent = `On overview: ${p.map(k => FEEDS[k].code).join(', ') || 'none'}`;
      $$('.pick').forEach(b => { const on = p.includes(b.dataset.f); b.setAttribute('aria-pressed', on); b.textContent = on ? 'On overview' : 'Add to overview'; b.closest('.feed').classList.toggle('picked', on); });
    };
    $$('.pick').forEach(b => b.onclick = () => {
      const p = pickedFeeds(), k = b.dataset.f;
      store.set('v181-feeds', p.includes(k) ? p.filter(x => x !== k) : [...p, k]);
      paint(); uart(`live: ${FEEDS[k].code} ${p.includes(k) ? 'removed from' : 'added to'} overview`);
    });
    $('#preset').onclick = () => { store.set('v181-feeds', DEFAULT_FEEDS); paint(); };
    paint();
    mountFeeds(app);
  }

  /* ---------- router ---------- */
  function go() {
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(s => { try { return decodeURIComponent(s); } catch { return s; } });
    const [p = '', id] = parts;
    let view;
    if (p === '') view = [pOverview(), mountOverview, 'Datasheet'];
    else if (p === 'work') view = [pWork(), mountWork, 'Work'];
    else if (p === 'lab') view = [pLab(), mountLab, 'Lab'];
    else if (p === 'photo') view = [pPhoto(), mountPhoto, 'Photo'];
    else if (p === 'blog') view = id ? pPost(id) : pBlog();
    else if (p === 'forum') view = id ? pThread(id) : [pForum(), mountForum, 'Forum'];
    else if (p === 'live') view = [pLive(), mountLive, 'Live feeds'];
    else view = p404();
    const [html, mount, title] = view, wasFirst = first;
    const swap = () => {
      cleanups.forEach(f => f()); cleanups = [];
      app.innerHTML = html;
      if (mount) mount(id);
      reveal();
      $$('.nav a').forEach(a => a.dataset.p === p ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
      document.title = `${title} · vije.sh`;
      if (!wasFirst) { scrollTo(0, 0); $('h1', app)?.focus({ preventScroll: true }); }
    };
    first = false;
    setMenu(false);
    if (!wasFirst && document.startViewTransition && !reduce()) document.startViewTransition(swap);
    else swap();
  }
  addEventListener('hashchange', go);
  const topEl = $('.top');
  const onScroll = () => topEl.classList.toggle('scrolled', scrollY > 8);
  addEventListener('scroll', onScroll, { passive: true }); onScroll();

  /* ---------- theme ---------- */
  const tb = $('#theme');
  tb.setAttribute('aria-pressed', document.documentElement.dataset.theme === 'dark');
  tb.onclick = () => {
    const d = tb.getAttribute('aria-pressed') !== 'true';
    if (d) document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;
    tb.setAttribute('aria-pressed', d); store.set('v181-theme', d ? 'dark' : 'light');
    uart(`pwr: ${d ? 'dark' : 'light'} mode`);
  };
  $('#skip').onclick = e => { e.preventDefault(); app.focus(); };

  const mb = $('#menu'), navEl = $('#nav');
  function setMenu(o) { mb.setAttribute('aria-expanded', o); navEl.classList.toggle('open', o); }
  mb.onclick = () => setMenu(mb.getAttribute('aria-expanded') !== 'true');
  addEventListener('keydown', e => { if (e.key === 'Escape' && navEl.classList.contains('open')) { setMenu(false); mb.focus(); } });
  document.addEventListener('click', e => { if (navEl.classList.contains('open') && !e.target.closest('.top')) setMenu(false); });

  /* ---------- launch ---------- */
  let launching = false;
  const ROCKET = `<svg class="rocket" viewBox="0 0 60 180" aria-hidden="true">
    <g class="flame"><path d="M19 132 Q30 182 41 132Z" fill="${R}"/><path d="M24 132 Q30 160 36 132Z" fill="#fff"/></g>
    <path d="M30 2 Q45 20 45 42 H15 Q15 20 30 2Z" fill="${R}"/><rect x="15" y="42" width="30" height="80" fill="var(--bg)" stroke="var(--ink)" stroke-width="2"/>
    <circle cx="30" cy="64" r="6" fill="var(--bg)" stroke="var(--ink)" stroke-width="2"/><path d="M15 92 L3 126 L15 122Z M45 92 L57 126 L45 122Z" fill="${R}"/>
    <path d="M21 122 H39 L42 132 H18Z" fill="var(--ink)"/><text x="30" y="104" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="7" font-weight="700" fill="var(--ink)" writing-mode="tb">VKG</text></svg>`;
  function launch() {
    if (launching) return;
    launching = true;
    uart('launch: sequence start. T-3.');
    const ov = document.createElement('div');
    ov.className = 'launch';
    ov.innerHTML = `<div class="count" role="status"></div>${ROCKET}`;
    document.body.append(ov);
    const count = $('.count', ov), rk = $('.rocket', ov);
    if (reduce()) { count.textContent = 'Liftoff'; setTimeout(() => { ov.remove(); launching = false; uart('launch: nominal.'); }, 1400); return; }
    ['T-3', 'T-2', 'T-1', 'Liftoff'].forEach((t, i) => setTimeout(() => {
      count.textContent = t;
      count.animate([{ opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1 }], { duration: 280, easing: 'ease-out' });
    }, i * 650));
    setTimeout(() => {
      rk.classList.add('go');
      for (let i = 0; i < 16; i++) {
        const p = document.createElement('span'); p.className = 'puff'; ov.append(p);
        const dx = (Math.random() - .5) * 520, s = .6 + Math.random() * 1.6;
        p.animate([{ transform: 'translate(0,0) scale(.3)', opacity: .7 }, { transform: `translate(${dx}px,${-20 - Math.random() * 90}px) scale(${s})`, opacity: 0 }], { duration: 1400 + Math.random() * 900, delay: i * 40, easing: 'ease-out', fill: 'forwards' });
      }
      app.animate([{ transform: 'translate(0,0)' }, { transform: 'translate(-2px,1px)' }, { transform: 'translate(2px,-1px)' }, { transform: 'translate(0,0)' }], { duration: 90, iterations: 7 });
      rk.animate([{ transform: 'translate(-50%,0)' }, { transform: 'translate(-50%,6px)', offset: .08 }, { transform: 'translate(-50%,-130vh)' }], { duration: 2600, easing: 'cubic-bezier(.55,0,.85,.55)', fill: 'forwards' })
        .onfinish = () => {
          const n = store.get('v181-launches', 0) + 1; store.set('v181-launches', n);
          uart(`launch: nominal. orbit reached (probably). flights: ${n}`);
          ov.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: 'forwards' }).onfinish = () => { ov.remove(); launching = false; };
        };
    }, 1950);
  }
  $('#launch').onclick = launch;

  let buf = '';
  addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1 || e.target.closest('input,textarea,select,[contenteditable]')) return;
    buf = (buf + e.key.toLowerCase()).slice(-8);
    if (buf.endsWith('launch')) { buf = ''; launch(); }
  });

  go();
})();
</script>
</body>
</html>
